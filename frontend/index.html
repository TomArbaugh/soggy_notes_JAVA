<!DOCTYPE html>
<!-- Declares HTML5 document type for standards mode in browsers. -->
<html lang="en">
  <!-- Root element; lang helps screen readers and SEO with language. -->
  <head>
    <!-- Metadata container loaded before visible page body. -->
    <meta charset="UTF-8" />
    <!-- UTF-8 ensures correct encoding for all text and symbols. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Viewport meta makes layout responsive on mobile devices. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!-- Primary tab icon as PNG for broad browser support (e.g. DuckDuckGo). -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Legacy ICO format for older clients that request favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Vector favicon for modern browsers that support SVG icons. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- iOS home screen icon when user saves the web app to the home screen. -->
    <title>Scale Ear Trainer</title>
    <!-- Document title shown in the browser tab and bookmarks. -->
  </head>
  <body>
    <!-- Visible page content begins here. -->
    <div id="root"></div>
    <!-- React mounts the single-page application into this empty div. -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- Vite loads the React entry as an ES module for hot reload and bundling. -->
  </body>
  <!-- End of visible document. -->
</html>
<!-- End of HTML document. -->
